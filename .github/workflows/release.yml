name: Release package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  TRIGGER_REF: ${{ github.ref }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.2.0 --ignore-scripts

      - name: Check release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if test "$GITHUB_EVENT_NAME" = "workflow_dispatch"; then
            test "$TRIGGER_REF" = "refs/heads/$DEFAULT_BRANCH"
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          node scripts/release-version.mjs

      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm test
      - run: node --test test/smoke-measurements.test.mjs test/publish-release.test.mjs test/release-version.test.mjs test/npm-publication.test.mjs
      - run: npm run check:package

      - name: Pack verified build
        run: |
          mkdir -p "$RUNNER_TEMP/release-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release-package"

      - name: Publish package and verify npm availability
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: node scripts/publish-release.mjs "$RUNNER_TEMP"/release-package/*.tgz

      - name: Create GitHub release and attach package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "opencode-reviewer $RELEASE_TAG")
          if test "$RELEASE_PRERELEASE" = "true"; then
            flags+=(--prerelease --latest=false)
            latest=false
          else
            flags+=(--latest)
            latest=true
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/release-package/*.tgz --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease="$RELEASE_PRERELEASE" --latest="$latest" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/release-package/*.tgz "${flags[@]}" --repo "$GITHUB_REPOSITORY"
          fi
